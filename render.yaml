services:
  - type: web
    name: giftforge
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install --include=dev && cp packages/backend/prisma/schema.postgresql.prisma packages/backend/prisma/schema.prisma && npx prisma generate --schema=packages/backend/prisma/schema.prisma && npm run build --workspace=packages/backend && npm run build --workspace=packages/bot
    startCommand: npx prisma db push --schema=packages/backend/prisma/schema.prisma --accept-data-loss && node packages/backend/dist/index.js & node packages/bot/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: giftforge-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: APP_URL
        value: https://my-telegram-bot-omega.vercel.app
      - key: PORT
        value: 10000

databases:
  - name: giftforge-db
    databaseName: giftforge
    plan: free
    region: frankfurt
