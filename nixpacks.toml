[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = [
  "cp packages/backend/prisma/schema.postgresql.prisma packages/backend/prisma/schema.prisma",
  "npx prisma generate --schema=packages/backend/prisma/schema.prisma",
  "npm run build --workspace=packages/backend",
  "npm run build --workspace=packages/bot"
]

[start]
cmd = "npx prisma db push --schema=packages/backend/prisma/schema.prisma --accept-data-loss && node packages/backend/dist/index.js & node packages/bot/dist/index.js"
